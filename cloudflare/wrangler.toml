name = "timepin-edge"
main = "worker.ts"
compatibility_date = "2026-09-01"

# Smart Placement: automatically runs the Worker at the Cloudflare PoP
# geographically closest to ticket.interpark.com (Seoul/ICN) instead of LAX.
# Reduces edge-to-target RTT from ~600ms to ~30ms.
[placement]
mode = "smart"


# Durable Objects Free Configuration
[durable_objects]
bindings = [
  { name = "TRAFFIC_DO", class_name = "TrafficAggregator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrafficAggregator"]

# Cloudflare Cron Triggers (Free Tier)
[triggers]
crons = [
  "*/30 * * * *",   # Major ticket platforms ingestion (Every 30 min)
  "0 1,13 * * *",   # KOPIS API ingestion (Twice daily)
  "0 * * * *"       # Durable Object Hourly Rollup Flush to Supabase & cleanup
]

