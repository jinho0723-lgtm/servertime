name: Automated Ticket Open Notices Ingestion

on:
  schedule:
    # Runs at 23:30, 02:30, 05:30, 08:30 UTC
    # Corresponding to 08:30, 11:30, 14:30, 17:30 KST (Korea Standard Time)
    - cron: '30 23,2,5,8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Live Ingest Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ywgmcwvysewfkwdzqtwg.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3Z21jd3Z5c2V3Zmt3ZHpxdHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MzcxMjIsImV4cCI6MjEwNjUxMzEyMn0.l0Z7kWjmw3qV23TzaSLqaUZ1MjQ0pClzi6WFtrQUk64' }}
        run: |
          node live-ingest.js
