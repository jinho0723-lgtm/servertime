<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Arc Sweep Gradient -->
    <linearGradient id="dialGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Center Hub Glow -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8" />

  <!-- 2. Track Background Ring -->
  <circle cx="256" cy="266" r="165" fill="none" stroke="#1E293B" stroke-width="34" stroke-linecap="round" opacity="0.6" />

  <!-- 3. Glowing Time Arc (Sweeping clockwise from 8 o'clock to 12 o'clock) -->
  <!-- Arc path from approx 135 deg to 270 deg (top) -->
  <path d="M 139 383 A 165 165 0 1 1 256 101" fill="none" stroke="url(#dialGrad)" stroke-width="34" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- 4. 12 O'Clock Tick Mark -->
  <line x1="256" y1="36" x2="256" y2="64" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" />

  <!-- 5. 12 O'Clock Target Point (The Zero-Second Pinpoint) -->
  <circle cx="256" cy="101" r="22" fill="#00F0FF" opacity="0.3" filter="url(#neonGlow)" />
  <circle cx="256" cy="101" r="14" fill="#00F0FF" stroke="#FFFFFF" stroke-width="4" />

  <!-- 6. Precision Needle (Pointing straight to 12:00:00) -->
  <!-- Left facet -->
  <polygon points="256,76 238,256 256,296" fill="#CBD5E1" />
  <!-- Right facet -->
  <polygon points="256,76 274,256 256,296" fill="#FFFFFF" />

  <!-- 7. Center Hub -->
  <circle cx="256" cy="266" r="48" fill="#0B132B" stroke="#00F0FF" stroke-width="10" filter="url(#neonGlow)" />
  <circle cx="256" cy="266" r="22" fill="#00F0FF" />
</svg>
